name: 功能建议
description: 建议一个符合首版产品边界的改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 README 的功能范围和非目标。当前项目不计划加入账号、额度、会员、邀请、支付、应用内客服、聊天记忆、开发者工具、应用内更新或遥测。

        请不要在建议中粘贴真实聊天、截图、API Key、二维码或其他个人数据。

  - type: checkboxes
    id: scope_ack
    attributes:
      label: 范围确认
      options:
        - label: 我已阅读 README 的功能范围和非目标，并确认建议不依赖项目开发者运营的服务端。
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 建议区域
      options:
        - Provider 配置或兼容性
        - 文本回复建议
        - 视觉回复
        - 悬浮球或界面
        - 自动/手动触发
        - 单聊排除
        - 回复数量
        - 文档、构建或 CI
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 说明当前做法、遇到的限制以及为什么需要这个改进。
      placeholder: 请使用合成示例描述场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你认为应用应如何工作；如有替代方案也请一并说明。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或额外信息
      description: 可选。请继续使用合成、脱敏内容。
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 隐私与兼容性影响
      description: 是否涉及新的权限、数据发送、Provider API、Keystore、备份或第三方依赖？
    validations:
      required: false

  - type: checkboxes
    id: privacy_ack
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除真实聊天、截图、API Key、二维码和其他个人数据。
          required: true
